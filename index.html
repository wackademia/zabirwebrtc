<!DOCTYPE html>
<html>
<head>
<title>WebRTC Call — Chapters 1-4</title>
<style>
  body { font-family: sans-serif; margin: 2em; }
  video { width: 320px; height: 240px; background: #222; margin-right: 1em; }
  #log { font-size: 0.85em; color: #444; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>

<h1>WebRTC Call</h1>

<div>
  <input id="roomInput" placeholder="Room name" />
  <button id="joinButton">Join / Create Room</button>
  <button id="hangupButton" disabled>Hang Up</button>
</div>

<p>
  <video id="localVideo" autoplay muted playsinline></video>
  <video id="remoteVideo" autoplay playsinline></video>
</p>

<div id="log"></div>

<!-- socket.io client library, served automatically by the socket.io server -->
<script src="/socket.io/socket.io.js"></script>
<!-- your free TURN credentials go here, see README.md -->
<script src="js/turn-config.js"></script>
<script src="js/client.js"></script>

</body>
</html>
